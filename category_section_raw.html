<script>
  document.addEventListener('DOMContentLoaded', () => {
    const section = document.querySelector('#category-circles-template--20379830059144__category_circles_home');
    if (!section) return;

    const grid = section.querySelector('.category-circles__grid');
    const prevBtn = section.querySelector('.category-circles__arrow--prev');
    const nextBtn = section.querySelector('.category-circles__arrow--next');

    if (!grid || !prevBtn || !nextBtn) return;

    const getScrollOffset = () => {
      const firstCard = grid.querySelector('.category-circles__card');
      if (!firstCard) return 150;
      return firstCard.offsetWidth + 20; // card width + gap (which is 20px on mobile)
    };

    nextBtn.addEventListener('click', () => {
      grid.scrollBy({ left: getScrollOffset() * 2, behavior: 'smooth' });
    });

    prevBtn.addEventListener('click', () => {
      grid.scrollBy({ left: -getScrollOffset() * 2, behavior: 'smooth' });
    });

    const toggleArrows = () => {
      if (window.innerWidth > 768) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        return;
      } else {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
      }
      
      const maxScroll = grid.scrollWidth - grid.clientWidth;
      if (grid.scrollLeft <= 5) {
        prevBtn.style.opacity = '0.3';
        prevBtn.style.pointerEvents = 'none';
      } else {
        prevBtn.style.opacity = '1';
        prevBtn.style.pointerEvents = 'auto';
      }

      if (grid.scrollLeft >= maxScroll - 5) {
        nextBtn.style.opacity = '0.3';
        nextBtn.style.pointerEvents = 'none';
      } else {
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
      }
    };

    grid.addEventListener('scroll', toggleArrows);
    window.addEventListener('resize', toggleArrows);
    setTimeout(toggleArrows, 300);
  });
</script>
